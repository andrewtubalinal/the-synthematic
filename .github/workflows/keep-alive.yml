# Keeps the Render free API awake — it sleeps after 15 idle minutes,
# so a ping every 14 min holds it up. Delete this file once the API
# runs on Cloud Run (scale-to-zero needs no babysitting).
# REQUIRES: this repo PUBLIC (Actions cron is free only on public repos).
# Setup: repo Settings → Secrets and variables → Actions → Variables
#        → add RENDER_URL = https://your-app.onrender.com
name: Keep API alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 30 "${{ vars.RENDER_URL }}/health" || true
