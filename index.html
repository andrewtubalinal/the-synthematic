<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040404" />
    <title>Synthematic - All-in-One Business Platform for Small Business</title>
    <meta
      name="description"
      content="Replace 5 tools with one. Calendar, tasks, boards, chat, time tracking, invoicing and document vault for your whole team - in one secure web app. From ₱499/month. No installs."
    />
    <link rel="canonical" href="https://synthematic.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Synthematic" />
    <meta property="og:title" content="Synthematic - Run your entire business from one app" />
    <meta
      property="og:description"
      content="Calendar, tasks, boards, chat, time tracking, invoicing and documents - one secure web app for your whole team. From ₱499/month."
    />
    <meta property="og:url" content="https://synthematic.app/" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:image" content="https://synthematic.app/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Synthematic - Run your entire business from one app" />
    <meta
      name="twitter:description"
      content="Calendar, tasks, boards, chat, time tracking, invoicing and documents - one secure web app for your whole team. From ₱499/month."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Synthematic",
            "url": "https://synthematic.app/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "All-in-one business platform for small businesses: calendar, tasks, kanban boards, team chat, time tracking, billing and invoicing, document vault, security and permissions, member management and property management - in one secure web app.",
            "offers": [
              { "@type": "Offer", "name": "Micro", "price": "499", "priceCurrency": "PHP", "description": "2-5 members, every module included" },
              { "@type": "Offer", "name": "Startup", "price": "999", "priceCurrency": "PHP", "description": "6-10 members, every module included" },
              { "@type": "Offer", "name": "Growth", "price": "1799", "priceCurrency": "PHP", "description": "11-20 members, every module included" },
              { "@type": "Offer", "name": "Business", "price": "3499", "priceCurrency": "PHP", "description": "21-50 members, every module included" }
            ]
          },
          {
            "@type": "Organization",
            "name": "Synthematic",
            "url": "https://synthematic.app/",
            "logo": "https://synthematic.app/favicon.svg"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does my team need to install anything?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Synthematic runs entirely in the browser - desktop or mobile. Send your team a link, they sign in, and they are working. No IT setup, no updates to chase."
                }
              },
              {
                "@type": "Question",
                "name": "Is our data secure?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Authentication and data run on Google's Firebase infrastructure with encryption in transit and at rest. Every member gets a role, and owners control exactly which modules each person can access."
                }
              },
              {
                "@type": "Question",
                "name": "How does billing work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Plans are monthly, priced in Philippine pesos, and include every module. Pay online or by bank transfer. Extra team members beyond your plan are just ₱150 per seat per month."
                }
              },
              {
                "@type": "Question",
                "name": "Can I cancel anytime?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. There are no lock-ins. Cancel anytime and keep access through the end of your billing period."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
